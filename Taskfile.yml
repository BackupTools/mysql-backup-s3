version: '3'

tasks:
  test:
    desc: "Integration test: build, run backup against mysql+minio, assert success"
    cmds:
      - defer: docker compose -f docker-compose.test.yml down -v
      - docker compose -f docker-compose.test.yml build mysql-backup
      - docker compose -f docker-compose.test.yml up -d --wait mysql minio
      - |
        OUTPUT=$(docker compose -f docker-compose.test.yml run --rm --no-deps mysql-backup /entrypoint.sh 2>&1)
        echo "$OUTPUT"
        echo "$OUTPUT" | grep -q "MySQL backup completed successfully" \
          || (echo "FAIL: success message not found in output" && exit 1)
      - |
        FILES=$(docker compose -f docker-compose.test.yml run --rm --no-deps \
          -e MC_HOST_backup=http://minio:minio123@minio:9000 \
          mysql-backup mc ls backup/test-backup/ --recursive --insecure 2>/dev/null)
        echo "$FILES"
        echo "$FILES" | grep -q "\.mysql\.sql" \
          || (echo "FAIL: no .mysql.sql files found in minio bucket" && exit 1)
        echo "PASS: backup file verified in minio"
      - |
        if docker compose -f docker-compose.test.yml run --rm --no-deps \
          -e MC_HOST_backup=http://minio:minio123@minio:9000 \
          mysql-backup sh -c \
          'mc find backup/test-backup/ --insecure 2>/dev/null | head -1 | xargs mc cat --insecure | pigz -d | grep -q "INSERT INTO \`test_table\`"'; then
          echo "PASS: backup content verified (test_table data found in dump)"
        else
          echo "FAIL: test_table data not found in backup content"
          exit 1
        fi
      - |
        docker compose -f docker-compose.test.yml run --rm --no-deps \
          -e S3_NAME=args-test/backup \
          -e MYSQLDUMP_ARGS="--ignore-table=test_db.test_table --ignore-table=test_db.other_table" \
          mysql-backup /entrypoint.sh
        DUMP=$(docker compose -f docker-compose.test.yml run --rm --no-deps \
          -e MC_HOST_backup=http://minio:minio123@minio:9000 \
          mysql-backup sh -c \
          'mc find backup/test-backup/args-test/ --insecure 2>/dev/null | head -1 | xargs mc cat --insecure | pigz -d')
        echo "$DUMP" | grep -q "CREATE DATABASE.*\`test_db\`" \
          || (echo "FAIL: test_db not found with MYSQLDUMP_ARGS" && exit 1)
        if echo "$DUMP" | grep -q "\`test_table\`"; then
          echo "FAIL: test_table found, MYSQLDUMP_ARGS not applied"
          exit 1
        fi
        echo "PASS: MYSQLDUMP_ARGS applied"
