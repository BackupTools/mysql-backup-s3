volumes:
    minio_data:
    mysql_data:

services:
  mysql-backup:
    image: backuptools/mysql-backup-s3
    restart: no
    build: .
    environment:
      - S3_BUCK=test-backup
      - S3_NAME=folder-name/backup-name-prefix
      - S3_URI=http://minio:minio123@minio:9000
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=mysql
      # Available: pigz, xz, bzip2, lrzip, brotli, zstd
      - COMPRESS=pigz
    depends_on:
      - minio
      - mysql
    entrypoint: ""
    command: "/bin/sh -c 'while :; do sleep 10s && ./entrypoint.sh; done'"

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001" --address 0.0.0.0:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: test_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./test-init.sql:/docker-entrypoint-initdb.d/init-dump.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 2s
      timeout: 5s
      retries: 30
